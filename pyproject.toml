[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "machincast"
version = "0.9.1"
description = "Système automatisé de diffusion sonore pour radio, sous Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Xavier Mouton-Dubosc" }]
dependencies = [
	"PySide6>=6.10,<6.11",  # Qt 6.10, version de Kubuntu 26.04 LTS
	"PyGObject>=3.48",
	"psycopg[binary]>=3.1",  # implémentation compilée, libpq comprise (https://github.com/dascritch/machincast/issues/305)
	"yoyo-migrations>=9.0",
	"python-magic>=0.4.27",  # type des fichiers, par libmagic (paquet libmagic1t64)
	"tomlkit>=0.12",  # préférences écrites dans machincast.toml, commentaires gardés
	# Serveur HTTPS de l'intranet (https://github.com/dascritch/machincast/issues/538), et HTTP/2 du scénario « release »
	# des flux (https://github.com/dascritch/machincast/issues/278).
	"hypercorn>=0.17",
	# Les versions des plugins et celles qu'ils demandent (https://github.com/dascritch/machincast/issues/585).
	"packaging>=24",
	# Les gabarits de l'intranet, surchargeables par un plugin (https://github.com/dascritch/machincast/issues/597).
	"jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
	"pytest>=8",
	"pytest-bdd>=8",
	"pytest-qt>=4.4",
	"ruff>=0.6",
	"coverage>=7.10",  # patch = ["subprocess"] : le code lancé en sous-processus est mesuré
	"mypy>=1.11",
	"pygobject-stubs>=2.11",
	# La règle polkit s'exécute avec Duktape, le moteur de polkitd (https://github.com/dascritch/machincast/issues/470) ;
	# dukpy 0.6 est passé à QuickJS.
	"dukpy>=0.5.1,<0.6",
]

[project.urls]
Source = "https://github.com/dascritch/machincast"
Tickets = "https://github.com/dascritch/machincast/issues"

[project.scripts]
Machin_player = "machincast.player.__main__:main"
Machin_indexer = "machincast.indexer.__main__:main"
Machin_interface = "machincast.interface.__main__:main"
Machin_maintenance-db = "machincast.maintenance:main"
Machin_backup-db = "machincast.backup:backup_main"
Machin_restore-db = "machincast.backup:restore_main"
Machin_purge = "machincast.purge:main"
Machin_grant-read = "machincast.access:main"
Machin_status = "machincast.status:main"
Machin_intranet = "machincast.intranet.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
machincast = ["py.typed", "templates/*.md", "migrations/*.sql", "locale/*/LC_MESSAGES/*.po", "interface/*.png", "interface/news.md", "interface/news.*.md", "interface/icons/*.svg", "intranet/static/*", "intranet/templates/*.jinja"]

# ─── Qualité ───────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
# La largeur où ruff format coupe le code ; aucune ligne n'est refusée parce que longue (E501 ignorée).
line-length = 120
src = ["src", "tests"]
# Écrans compilés par pyside6-uic, jamais modifiés à la main (CONTRIBUTING.md).
extend-exclude = ["src/machincast/interface/ui/*.py"]

[tool.ruff.format]
# Indentation par tabulations, pour des raisons d'accessibilité (doc/fr/regles/developpement.md).
indent-style = "tab"

[tool.ruff.lint]
# RUF100 refuse un « # noqa » qui ne supprime rien : il vise une règle que ruff n'applique pas, ou qui ne se
# déclenche plus (https://github.com/dascritch/machincast/issues/438).
# C901 refuse une fonction trop complexe : plus de 15 chemins (https://github.com/dascritch/machincast/issues/439).
# PLW0127 refuse une affectation à soi-même, PLW1510 un subprocess.run sans check explicite (https://github.com/dascritch/machincast/issues/443).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF100", "C901", "FBT001", "FBT002", "PLW0127", "PLW1510"]
# FBT001 et FBT002 refusent un booléen passé par sa position : un appel se lit sans ouvrir la définition, le booléen est
# nommé obligatoire (« * »), sauf le paramètre d'un signal de Qt, que Qt passe par sa position, marqué « noqa »
# (https://github.com/dascritch/machincast/issues/441).
# W191 signale les tabulations : désactivée, puisque les tabulations sont la règle du projet.
# SIM108 réclame une expression conditionnelle à la place d'un if, SIM110 un any() ou un all() sur une expression
# génératrice à la place d'une boucle for : désactivées, le code n'a ni expression conditionnelle ni
# compréhension (doc/fr/regles/developpement.md, https://github.com/dascritch/machincast/issues/340).
# E501 refuse une ligne de plus de line-length caractères : désactivée, une contrainte d'éditeurs qui n'a plus cours
# (https://github.com/dascritch/machincast/issues/384).
ignore = ["W191", "SIM108", "SIM110", "E501"]

[tool.ruff.lint.per-file-ignores]
# Les étapes des scénarios reçoivent leurs paramètres par leur nom, booléens compris.
"tests/**" = ["FBT001", "FBT002", "PLW1510"]

[tool.ruff.lint.mccabe]
# Les fonctions imbriquées comptent dans celle qui les contient : une fonction qui en déclare beaucoup se découpe en
# fonctions de module (doc/fr/regles/developpement.md).
max-complexity = 15

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
# setupUi n'est pas annoté : l'appeler depuis un code typé reste permis.
untyped_calls_exclude = ["machincast.interface.ui"]

[[tool.mypy.overrides]]
# Modules générés par pyside6-uic (CONTRIBUTING.md).
module = ["machincast.interface.ui.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
# Les titres de colonnes d'une table (horizontalHeaderItem) y sont posés sans vérifier leur existence.
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
# yoyo-migrations ne publie pas d'annotations de type.
module = ["yoyo", "yoyo.*"]
ignore_missing_imports = true

[tool.coverage.run]
# Mesure du code de MachinCast, sous-processus compris (Machin dev-test --coverage,
# https://github.com/dascritch/machincast/issues/438) : un fichier de données par processus, que « coverage combine »
# réunit.
source_pkgs = ["machincast"]
parallel = true
patch = ["subprocess"]
data_file = ".coverage/data"

[tool.coverage.report]
show_missing = true
skip_empty = true

# ─── Tests ─────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
# Les scénarios « release » se lancent à part, avant une version : pytest -m release (TROUBLESHOOTING.md).
addopts = "--strict-markers -m 'not release'"
markers = [
	"release: scénario lent ou à dépendances réseau, lancé avant une version seulement (pytest -m release)",
	"pipewire: scénario sur un PipeWire et un WirePlumber à part, ignoré sans eux",
]
