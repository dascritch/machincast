# Modèle de configuration de MachinCast.
#
# Copier ce fichier en machincast.toml dans le répertoire du projet, puis l'adapter.
# machincast.toml est ignoré par git : il ne doit jamais être versionné.
# Un autre fichier peut être utilisé avec l'option --config, par exemple pour les tests.
#
# Toute clé inconnue est refusée au chargement, pour détecter les fautes de frappe.
# Les chemins relatifs sont résolus depuis le répertoire de ce fichier.

[base]
# Répertoire de la socket Unix de PostgreSQL (authentification peer).
socket = "/var/run/postgresql"
# Base de production, utilisée par la diffusion.
production = "machincast"
# Base de test, utilisée par les tests automatisés. Doit différer de la base de production : le chargement refuse sinon.
test = "machincast_test"
# Durée de péremption, en jours entiers, 1 au moins : Machin purge efface de la base les passages de l'airplay et les
# lignes du log plus vieux, et les éléments supprimés depuis plus longtemps ; jamais un fichier sonore. 60 par défaut.
# Elle se règle aussi dans Machin interface, Fichier → Préférences…, page Base, qui l'écrit ici.
# peremption = 60

[audio]
# Sortie audio de l'antenne : "alsa", "pulseaudio", "pipewire", ou "factice" pour ne jouer aucun son (essais).
# Chacune demande son greffon GStreamer : gstreamer1.0-alsa, gstreamer1.0-pulseaudio ou gstreamer1.0-pipewire.
# Avec "alsa", le VU-mètre de l'interface n'est pas disponible, et le périphérique doit mélanger deux sons
# (crossfade) : "default" convient, un périphérique matériel direct ("hw:…") non.
sortie = "pipewire"
# Périphérique de l'antenne. Obligatoire pour diffuser, sauf sur la sortie "factice" : sans lui, Machin lecture refuse
# de démarrer, car le périphérique par défaut pourrait être celui de la pré-écoute. Il se choisit aussi dans
# Machin interface, Fichier → Préférences…, page Audio, qui l'écrit ici.
# peripherique = "alsa_output.pci-0000_00_1f.3.analog-stereo"
# Périphérique de pré-écoute de l'interface. Obligatoire, et différent du périphérique de l'antenne.
preecoute = "alsa_output.usb-casque.analog-stereo"

[sorties]
# Airplay au format CSV (sortie privée : tous les sonores), un fichier par jour : la date du jour au format
# ISO 8601 s'ajoute au nom, « sorties/airplay-2026-10-15.csv ». Séparateur « ; », UTF-8 avec BOM.
csv = "sorties/airplay.csv"
# Playlist des 100 derniers fichiers joués, au format .pls (sortie privée).
pls = "sorties/playlist.pls"
# Page HTML du sonore à l'antenne et des 20 précédents (sortie publique : le masquage des métadonnées s'applique).
html = "sorties/airplay.html"

[metadonnees]
# Masquage par défaut de l'artiste et du titre sur les sorties publiques.
# Priorité : événement > banque > sonore > cette valeur.
masquer = false
# Texte affiché sur les sorties publiques à la place de l'artiste et du titre masqués,
# quand l'événement en cours n'a pas de nom public. 255 caractères au maximum.
texte_public = "Radio FMR"

[lecture]
# Socket d'état de Machin lecture, lue par l'interface. Facultative : par défaut
# $XDG_RUNTIME_DIR/machincast/lecture.sock, privée au compte et effacée au redémarrage du poste.
# socket_etat = "/run/user/1000/machincast/lecture.sock"

[crossfades]
# Réglages des crossfades (https://github.com/dascritch/machincast/issues/145), modifiables dans les préférences de
# l'interface. Section facultative, comme chacune de ses clés.
# Pas des crossfades dans l'interface : "seconde" ou "dixieme" (par défaut).
granularite = "dixieme"
# Crossfade le plus long que l'interface propose, en secondes ; 10 par défaut.
maximum = 10
# Crossfades, en secondes, d'un sonore qui n'en a pas de paramétré et que sa banque ne règle pas. Sans ces clés, il
# n'en a pas.
# debut = 1.5
# fin = 2
# Position des fondus d'un sonore joué sans ses silences détectés (https://github.com/dascritch/machincast/issues/234) :
# le fade-in "commence", est "en_cours" ou se "termine" au début détecté ; le fade-out, à la fin détectée.
position_entree = "termine"
position_sortie = "commence"

[silences]
# Détection de silence (https://github.com/dascritch/machincast/issues/146), modifiable dans les préférences de
# l'interface, page « Audio ». Section facultative, comme sa clé.
# Niveau crête, en dB, sous lequel le début et la fin d'un sonore sont un silence : 0 dB est la pleine échelle. De -100
# compris à 0 exclu ; -40 par défaut. L'audit complet mesure les silences à ce seuil : un nouveau seuil vaut pour les
# audits suivants. Une banque, ou un sonore, choisit ensuite d'être joué sans ses silences. Cette section s'appelait
# [blancs] : l'ancien nom est encore lu, avec un avertissement (https://github.com/dascritch/machincast/issues/291).
seuil = -40

[blanc_antenne]
# Blanc dans un sonore, à l'antenne (https://github.com/dascritch/machincast/issues/122), modifiable dans les
# préférences de l'interface, page « Audio ». Section facultative, comme ses clés ; Machin lecture la prend à son
# prochain démarrage. À ne pas confondre avec un silence, au début ou à la fin d'un fichier ([silences]) : un blanc est
# un sonore qui ne donne plus de son pendant qu'il joue. Il est noté dans le log, en incident « blanc dans un sonore ».
# Durée d'un blanc, en secondes : de 1 à 300 comprises ; 10 par défaut.
duree = 10
# Niveau crête d'un blanc, en dB : de -100 compris à 0 exclu ; -90 par défaut.
seuil = -90
# true : un blanc fait passer au sonore suivant ; un stream laisse l'antenne à son événement de secours, ou à
# l'événement inférieur, et la reprend dès que son son revient. false, par défaut : le blanc est seulement noté.
secours = false

[interface]
# Réglages de l'interface graphique (https://github.com/dascritch/machincast/issues/191), modifiables dans ses
# préférences, page « Interface ». Section facultative, comme sa clé.
# Le voyant « Saturation » de la colonne Antenne de l'accueil : true pour l'afficher (par défaut), false pour le cacher.
# saturation = true
# Au lancement, l'interface propose de créer ce qui manque pour démarrer : fil musical, banques de base, périphérique
# de l'antenne (https://github.com/dascritch/machincast/issues/119). true par défaut ; false l'éteint, comme la case
# « Ne plus proposer au lancement » de sa fenêtre.
# suggestions = true
# Icône de l'application (https://github.com/dascritch/machincast/issues/111) : une image SVG, PNG ou JPEG, de
# préférence carrée, pour les fenêtres de MachinCast, ses raccourcis et la barre des tâches. Sans cette clé, ou si
# l'image manque sur le poste, l'icône de MachinCast. Se choisit aussi dans les préférences, page « Interface », qui
# l'écrit ici et met à jour les raccourcis déjà installés.
# icone = "/home/radio/images/logo-radio.png"
