# MachinCast configuration template.
#
# Copy this file to machincast.toml in the project directory, then adapt it.
# machincast.toml is ignored by git: it must never be versioned.
# Another file can be used with the --config option, for instance for the tests.
#
# Any unknown key is refused when loading, to catch typos.
# Relative paths are resolved from the directory of this file.
# Sections and keys are in English since https://github.com/dascritch/machincast/issues/357: the former French
# names ([base], [sorties], [metadonnees], [lecture], [blanc_antenne]…) are refused.

[database]
# Directory of the PostgreSQL Unix socket (peer authentication).
socket = "/var/run/postgresql"
# Production database, used by playout.
production = "machincast"
# Test database, used by the automated tests. Must differ from the production database: loading refuses otherwise.
test = "machincast_test"
# Retention period, in whole days, at least 1: Machin purge deletes from the database the airplay entries and log
# lines older than this, and the items deleted longer ago; never a sound file. 60 by default.
# Also set in Machin interface, Fichier → Préférences…, Base page, which writes it here.
# retention = 60

[audio]
# On-air audio output: "alsa", "pulseaudio", "pipewire", or "dummy" to play no sound at all (trials).
# Each needs its GStreamer plugin: gstreamer1.0-alsa, gstreamer1.0-pulseaudio or gstreamer1.0-pipewire.
# With "alsa", the interface's VU meter is not available, and the device must mix two sounds (crossfade):
# "default" will do, a direct hardware device ("hw:…") will not.
output = "pipewire"
# On-air device. Required for playout, except on the "dummy" output: without it, Machin player refuses to start, as
# the default device could be the preview one. It can also be chosen in Machin interface, Fichier → Préférences…,
# Audio page, which writes it here.
# "dummy", the dummy output entry, makes the station play without any sound, whatever the output: only without the
# playout service installed (install.sh without --service).
# device = "alsa_output.pci-0000_00_1f.3.analog-stereo"
# Preview device of the interface. Required, and different from the on-air device. "dummy", the dummy output entry,
# disables the preview.
preview = "alsa_output.usb-casque.analog-stereo"

[outputs]
# Airplay as CSV (private output: every sound), one file per day: the day's date in ISO 8601 format is added to the
# name, « outputs/airplay-2026-10-15.csv ». Separator « ; », UTF-8 with BOM.
csv = "sorties/airplay.csv"
# Playlist of the last 100 files played, as .pls (private output).
pls = "sorties/playlist.pls"
# HTML page of the sound on air and of the 20 previous ones (public output: metadata hiding applies).
html = "sorties/airplay.html"

[metadata]
# Default hiding of the artist and title on the public outputs.
# Priority: event > bank > sound > this value.
hide = false
# Text shown on the public outputs instead of the hidden artist and title, when the current event has no public
# name. 255 characters at most.
public_text = "Radio FMR"

[player]
# State socket of Machin player, read by the interface. Optional: by default
# $XDG_RUNTIME_DIR/machincast/lecture.sock, private to the account and deleted when the machine restarts.
# state_socket = "/run/user/1000/machincast/lecture.sock"

[crossfades]
# Crossfade settings (https://github.com/dascritch/machincast/issues/145), which can be changed in the interface's
# preferences. Optional section, like each of its keys.
# Crossfade step in the interface: "second" or "tenth" (default).
granularity = "tenth"
# Longest crossfade the interface offers, in seconds; 10 by default.
maximum = 10
# Crossfades, in seconds, of a sound that has none set and whose bank does not set them. Without these keys, it has
# none.
# start = 1.5
# end = 2
# Position of the fades of a sound played without its detected silences
# (https://github.com/dascritch/machincast/issues/234): the fade-in "starts", is "ongoing" or "ends" at the detected
# start; the fade-out, at the detected end.
fade_in_position = "ends"
fade_out_position = "starts"

[silences]
# Silence detection (https://github.com/dascritch/machincast/issues/146), which can be changed in the interface's
# preferences, « Crossfades » page. Optional section, like its key.
# Peak level, in dB, under which the start and the end of a sound are silence: 0 dB is full scale. From -100 included
# to 0 excluded; -40 by default. The full audit measures silences at this threshold: a new threshold applies to the
# following audits. A bank, or a sound, then chooses to be played without its silences.
threshold = -40

[dead_air]
# Dead air in a sound, on air (https://github.com/dascritch/machincast/issues/122), which can be changed in the
# interface's preferences, « Audio » page. Optional section, like its keys; Machin player takes it at its next start.
# Not to be confused with a silence, at the start or the end of a file ([silences]): dead air is a sound that no
# longer gives any sound while it plays. It is recorded in the log, as a « blanc dans un sonore » incident.
# Duration of dead air, in seconds: from 1 to 300 included; 10 by default.
duration = 10
# Peak level of dead air, in dB: from -100 included to 0 excluded; -90 by default.
threshold = -90
# true: dead air moves on to the next sound; a stream leaves the station to its fallback event, or to the lower
# event, and takes it back as soon as its sound returns. false, the default: dead air is only recorded.
fallback = false

[interface]
# Settings of the graphical interface (https://github.com/dascritch/machincast/issues/191), which can be changed in
# its preferences, « Interface » page. Optional section, like its keys.
# The « Saturation » (clipping) light of the on-air column, in the tab of the same name: true to show it (default),
# false to hide it.
# clipping = true
# At start-up, the interface offers to create what is missing to start: music feed, basic banks, on-air device
# (https://github.com/dascritch/machincast/issues/119). true by default; false turns it off, like the « Ne plus
# proposer au lancement » box of its window.
# suggestions = true
# Application icon (https://github.com/dascritch/machincast/issues/111): an SVG, PNG or JPEG image, preferably square,
# for MachinCast's windows, its shortcuts and the task bar. Without this key, or if the image is missing on the
# machine, the MachinCast icon. Also chosen in the preferences, « Interface » page, which writes it here and updates
# the shortcuts already installed.
# icon = "/home/radio/images/logo-radio.png"
# The rows that the sound table of a bank card loads at a time (https://github.com/dascritch/machincast/issues/383): the
# rest is loaded as you scroll down. 1000 by default, at least 100. Also set in the preferences, « Interface » page; a
# higher number can strongly slow down the interface for a bank with a very large number of sounds.
# table_rows = 1000
